# ==============================================================================
# BRONME PICOM COMPOSITOR CONFIGURATION
# macOS-grade Dual-Kawase blur, rounded corners, and soft drop shadows
# ==============================================================================

# Backend
backend = "glx";
vsync = true;
glx-no-stencil = true;
glx-no-rebind-pixmap = true;

# Rounded Corners (Cupertino Style)
corner-radius = 14;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Soft Drop Shadows (Apple Depth Effect)
shadow = true;
shadow-radius = 24;
shadow-opacity = 0.35;
shadow-offset-x = -18;
shadow-offset-y = -14;
shadow-color = "#000000";

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Plank'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Dual-Kawase Frosted Glass Blur
blur: {
  method = "dual_kawase";
  strength = 7;
  background = true;
  background-frame = false;
  background-fixed = false;
}

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Smooth Window Fade & Transitions
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 6;
